<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff0f6">
  <title>Sorry Manya ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff0f6;
      font-family: 'Nunito', sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    .center {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 24px 20px;
      width: 100%;
      max-width: 480px;
    }

    .main-text {
      font-family: 'Pacifico', cursive;
      font-size: clamp(36px, 11vw, 80px);
      color: #e84393;
      line-height: 1.35;
      text-shadow:
        3px 3px 0px #fbb6d5,
        0 0 40px rgba(232, 67, 147, 0.3);
      animation: pop 0.8s cubic-bezier(.22,.68,0,1.4) both;
      word-break: break-word;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    .heart {
      display: block;
      font-size: clamp(60px, 18vw, 120px);
      margin-top: 8px;
      animation: beat 1.2s ease-in-out infinite, pop 0.8s cubic-bezier(.22,.68,0,1.4) 0.3s both;
      filter: drop-shadow(0 0 18px rgba(232, 67, 147, 0.5));
      line-height: 1;
    }

    @keyframes beat {
      0%,100% { transform: scale(1); }
      15%      { transform: scale(1.3); }
      30%      { transform: scale(1); }
      45%      { transform: scale(1.2); }
    }

    .btn {
      margin-top: 36px;
      display: inline-block;
      padding: 18px 44px;
      background: linear-gradient(135deg, #e84393, #f472b6);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(17px, 4.5vw, 22px);
      font-weight: 800;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(232, 67, 147, 0.4);
      transition: transform .2s, box-shadow .2s;
      animation: pop 0.8s cubic-bezier(.22,.68,0,1.4) 0.6s both;
      min-width: 200px;
      /* big tap target for mobile */
      min-height: 56px;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.93); }
    .btn:disabled {
      background: linear-gradient(135deg, #10b981, #34d399);
      box-shadow: 0 6px 24px rgba(16,185,129,.4);
      cursor: default;
    }

    .reply {
      display: none;
      margin-top: 24px;
      font-size: clamp(20px, 6vw, 32px);
      font-weight: 800;
      color: #e84393;
      animation: pop .5s cubic-bezier(.22,.68,0,1.4) both;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<div class="center">
  <div class="main-text">I am sorry Manya</div>
  <span class="heart">❤️</span>
  <br>
  <button class="btn" id="btn" onclick="forgive()">Maaf karo? 🥺</button>
  <div class="reply" id="reply">Yayy!! Thank you Manya 🎉❤️</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const emojis = ['❤️','💕','💖','🌸','✨','💗','🥺','🎀'];

class Particle {
  constructor(burst) {
    this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
    this.rot  = Math.random() * 360;
    this.rotV = (Math.random() - .5) * 4;
    this.burst = !!burst;
    if (burst) {
      this.x = burst.x; this.y = burst.y;
      this.vx = (Math.random() - .5) * 14;
      this.vy = -Math.random() * 12 - 3;
      this.gravity = .35;
      this.life = 1;
      this.decay = .018 + Math.random() * .012;
      this.size = 22 + Math.random() * 18;
    } else {
      this.reset();
    }
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = -40;
    this.vx = (Math.random() - .5) * .8;
    this.vy = .8 + Math.random() * 1.2;
    this.gravity = 0;
    this.life = 1; this.decay = 0;
    this.size = 18 + Math.random() * 14;
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.vy += this.gravity;
    this.rot += this.rotV;
    if (this.burst) { this.life -= this.decay; return this.life > 0; }
    if (this.y > canvas.height + 50) this.reset();
    return true;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot * Math.PI / 180);
    ctx.globalAlpha = this.burst ? this.life : .75;
    ctx.font = this.size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.emoji, 0, 0);
    ctx.restore();
  }
}

const pool = [];
for (let i = 0; i < 30; i++) {
  const p = new Particle(null);
  p.y = Math.random() * canvas.height;
  pool.push(p);
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = pool.length - 1; i >= 0; i--) {
    if (!pool[i].update()) pool.splice(i, 1);
    else pool[i].draw();
  }
  requestAnimationFrame(loop);
}
loop();

function forgive() {
  const btn = document.getElementById('btn');
  btn.textContent = 'Maaf kar diya!! 🎉';
  btn.disabled = true;
  document.getElementById('reply').style.display = 'block';
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 45; i++) pool.push(new Particle({ x: cx, y: cy }));
  setTimeout(() => { for (let i = 0; i < 35; i++) pool.push(new Particle({ x: cx, y: cy })); }, 350);
}
</script>
</body>
</html>
